services:
  postgres:
    image: postgres:16-alpine
    container_name: oneatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oneatlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oneatlas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
